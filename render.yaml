services:
  - type: web
    name: revalueiq-backend
    runtime: python
    repo: https://github.com/rupam1116/RevalueIQ
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: MONGODB_DATABASE_NAME
        value: revalueiq
      - key: MONGODB_URI
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: revalueiq-165c1
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PAYMENT_GATEWAY
        value: razorpay
      - key: PAYMENT_KEY_ID
        sync: false
      - key: PAYMENT_KEY_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: REPAIR_MAP_PROVIDER
        value: osm
      - key: FRONTEND_URL
        value: https://revalueiq.vercel.app,http://localhost:3000,http://127.0.0.1:3000
